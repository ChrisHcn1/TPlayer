<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="tplayer-favicon-title">
  <title id="tplayer-favicon-title">TPlayer</title>
  <desc>极小尺寸简化版徽章图标：加粗声波柱，16×16 下仍可辨识。</desc>
  <!-- 底板：品牌实心色，圆角为边长 25%（8/32） -->
  <rect x="0" y="0" width="32" height="32" rx="8" fill="#2F6FEB"/>
  <!-- 声波柱：加粗至 6、间距 2，中柱高 18、两侧高 12（color-on-brand） -->
  <g fill="#FFFFFF">
    <rect x="5" y="10" width="6" height="12" rx="3"/>
    <rect x="13" y="7" width="6" height="18" rx="3"/>
    <rect x="21" y="10" width="6" height="12" rx="3"/>
  </g>
</svg>

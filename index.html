<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TPlayer</title>
    <script>
      /*
       * 首屏主题预加载（M0 修正版）
       *
       * 修复旧版 index.html 的三处问题：
       *  1. 死代码：旧版在 <head> 中判断 document.body 是否存在，解析期必然为 null，
       *     整个 DOMContentLoaded 分支从未生效；
       *  2. 逻辑重复：旧版同时设置 documentElement 的 data-theme、class="light"
       *     和 body 内联样式三套机制，互相覆盖且难以维护；
       *  3. 默认值不一致：旧版 CSS 写死深色、脚本默认浅色，首屏颜色取决于哪段先执行。
       *
       * 现约定：
       *  - 主题唯一载体是 <html data-theme="dark|light">，样式全部走 CSS 变量；
       *  - 唯一数据源是 localStorage 的主题键，其唯一持有者为
       *    src/composables/useTheme.ts（settings store 已移除 theme 字段，杜绝双写双源）；
       *  - 默认主题固定为 dark，与 <html> 上的静态属性及 theme.css 兜底值一致；
       *  - 此脚本不访问 document.body（此时尚未解析），只做一次最小同步。
       *
       * 命名隔离（与 src/constants.ts 的 THEME_STORAGE_KEY 保持一致）：
       *  - Linux 桌面端（Tauri WebView + Linux UA）：键为 'tplayer.theme'；
       *  - Windows 桌面端与浏览器预览：保持历史键 'tplayer-next.theme'，
       *    线上 Windows 用户的主题偏好不因键名变更而丢失。
       */
      (function () {
        try {
          var isLinuxDesktop =
            typeof window !== 'undefined' &&
            '__TAURI_INTERNALS__' in window &&
            /X11|Linux/i.test(navigator.userAgent)
          var THEME_KEY = (isLinuxDesktop ? 'tplayer' : 'tplayer-next') + '.theme'
          var theme = localStorage.getItem(THEME_KEY)
          if (theme !== 'light' && theme !== 'dark') {
            theme = 'dark'
          }
          document.documentElement.setAttribute('data-theme', theme)
          /*
           * 实验室·窗口底纹：窗口已常驻 transparent:true（见 tauri.conf.json），
           * CSS 就绪前窗口是透明的，会露出桌面 / 白闪。这里按当前主题先垫一层
           * 不透明底色作为首帧 Paint，CSS（main.css 的 body 背景）就绪后接管；
           * 底纹功能开启时再由 lab-backdrop.css 把 body 置透明。
           * 取值与 theme.css 的 --palette-neutral-950 / 亮色 --color-bg-base 对齐。
           */
          document.documentElement.style.setProperty(
            '--boot-bg',
            theme === 'light' ? '#f0f1f4' : '#0f1115'
          )
        } catch (e) {
          /* localStorage 不可用（隐私模式/受限 WebView）时，保留静态默认值 dark */
        }
      })()
    </script>
    <script>
      /*
       * 屏蔽 WebView 原生右键菜单（Tauri/WebView2/WKWebView 默认弹出的系统菜单，
       * 含「后退 / 刷新 / 另存为 / 检查」等，与应用自定义右键菜单冲突）。
       *
       * 方案：在 contextmenu 事件上 preventDefault()，仅抑制**原生**菜单；
       * 事件本身仍正常派发——应用自己的 @contextmenu 自定义菜单（useContextMenu）
       * 由独立监听器驱动，不受影响。
       *
       * 例外：可编辑元素（input / textarea / contenteditable / role=textbox）
       * 保留原生编辑菜单，方便剪切 / 复制 / 粘贴。
       */
      (function () {
        document.addEventListener('contextmenu', function (e) {
          var t = e.target
          var editable =
            !!t &&
            (t.tagName === 'INPUT' ||
              t.tagName === 'TEXTAREA' ||
              t.isContentEditable === true ||
              (t.getAttribute && t.getAttribute('role') === 'textbox'))
          if (!editable) {
            e.preventDefault()
          }
        })
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
  <style>
    /* 首帧底色（由上方脚本按主题写入 --boot-bg）：窗口常驻 transparent 后的防露底/白闪兜底 */
    body {
      background: var(--boot-bg, #0f1115);
    }
  </style>
</html>

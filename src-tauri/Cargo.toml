# TPlayer Next —— 后端 crate（M0 骨架）
#
# 命名约定（与 README.md「命名与共存方案」表格一致，不得随意改动）：
#   - 包名/可执行文件名：tplayer-next（crate 名用连字符；最终安装包名由 tauri.conf.json 决定）
#   - 产品名 productName：TPlayer Next
#   - 应用标识 identifier：com.tplayer.next
# 版本号需与 package.json / tauri.conf.json 在发布前保持一致（M1 验收项，见 ROADMAP.md）。

[package]
name = "tplayer-next"
version = "2.0.3"
description = "TPlayer Next —— 本地优先的桌面音乐播放器（Tauri 2 后端）"
authors = ["TPlayer Next Contributors"]
edition = "2021"
rust-version = "1.77"
license = "ISC"

[lib]
# Tauri 2 约定：业务逻辑放在 lib 中，main.rs 仅作入口。
# 拆 lib 的好处：后续可接入集成测试与移动端目标，无需改动逻辑分层。
name = "tplayer_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset：封面/歌词封面通过 asset:// 协议展示时必需；
# 其访问范围由 tauri.conf.json 的 app.security.assetProtocol.scope 限定（禁止 **/*）。
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# 应用内自动升级（GitHub Releases 通道，minisign 签名校验）
tauri-plugin-updater = "2"
# 升级完成后重启应用
tauri-plugin-process = "2"
# 曲库持久化：bundled 编译自带 SQLite amalgamation，无需目标机安装系统库
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# 播放引擎：rodio 内置 symphonia 解码，支持 mp3/flac/wav/ogg/aac 等
rodio = "0.19"
# 元数据读取：标题/艺术家/专辑/时长/封面等标签
lofty = "0.22"
# 稳定曲目 ID 生成（基于文件路径哈希）
sha2 = "0.10"
# SACD ISO 解析（按大端字节序读取 ISO-9660 / DSD 头部）
byteorder = "1"
# 异步运行时（Tauri 已带 tokio，但显式声明便于 spawn 扫描任务）
tokio = { version = "1", features = ["sync", "rt"] }
# 时间戳
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 随机播放模式
rand = "0.8"
# 目录自动监控：监听曲库目录文件变更（新增/删除/重命名/修改），增量同步进曲库
notify = "6"
# LRC 时间标签解析
regex = "1"
# 文本编码自动识别：CUE/LRC 等本地文本常为 GBK/GB18030（中文），需正确解码否则标题乱码、
# FILE 路径错误导致无法播放
encoding_rs = "0.8"
# 在线歌词抓取（默认关闭，受设置开关控制）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[profile.release]
# 旧版安装包体积偏大（FFmpeg 约 240MB 全量随包分发），发布构建开启体积优化。
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Windows 系统媒体控制（SMTC / 任务栏 / 锁屏 / 耳机线控）—— 仅 Windows 目标编译
[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
    "Foundation",
    "Media",
    "Media_Playback",
    # Package::Current() 检测是否运行在 MSIX / Microsoft Store 容器内
    "ApplicationModel",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    # GetDriveTypeW：识别映射的网络盘符（后台补解析需跳过网络 IO）
    "Win32_Storage_FileSystem",
    # 注：ICoreWebView2* 接口由 wry 的 webview2-com 依赖链提供（见 wry 直接依赖），
    # 不在 windows crate 的 feature 体系中，此处不启用任何 Win32_Web_WebView2 feature。
] }

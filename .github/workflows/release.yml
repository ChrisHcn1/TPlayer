name: Release

# 推送 v 开头的 tag 触发发布（如 v2.0.5）；也支持 Actions 页面手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# =============================================================================
# 三平台独立打包：Windows(NSIS) + macOS(.app/.dmg) + Linux(原生 DEB)
#
# 必需仓库 Secret（Settings → Secrets and variables → Actions）：
#   TAURI_SIGNING_PRIVATE_KEY           更新签名私钥内容（= src-tauri/.tauri-signing/TPlayerNext.key 文件内容）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  私钥密码（无密码可建一个空 Secret 或省略）
#
# 可选 Secret（macOS 开发者签名/公证，未配置则产出未签名包，右键→打开可运行）：
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#
# 说明：
#   - create-release：先建草稿 Release，三个平台 job 独立上传 artifact，互不依赖
#   - Windows 走 tauri-action：构建 + 签名 + 生成 latest.json（应用内自动升级清单）
#   - macOS / Linux 仅构建并上传各自安装包（不写 latest.json，避免竞态）
#   - macOS 默认构建 Apple Silicon（macos-latest = arm64）
#   - Linux 用 scripts/build-deb.sh 原生 dpkg 打包（bin/linux 不在仓库 → 依赖系统 ffmpeg）
#
# 关于解码组件（ffmpeg / ffprobe / sacd_extract）——【随 2.0.4 主程序一同发布】
#   - 已从主安装包剥离，改为独立可选依赖。为「与主程序同步打包、避免拆分发布」，
#     自 2.0.4 起，依赖包 **作为主 Release 的附件**随 v2.0.4 一同发布（见下方
#     release-windows 的「Build deps pack」+「Upload deps pack」两步），
#     不再单独发 deps-v* tag。
#   - 主包不再分发这三个二进制 → Windows 安装包从 ~470MB 降到 ~20MB；
#   - 依赖包安装到公共目录（应用数据目录之外的 deps/packs/<版本>），
#     主程序覆盖安装 / 卸载都不会删除它，更新场景自动复用，无需重下；
#   - MSIX 渠道仍内置（Store 沙箱不允许运行时下载并执行包外二进制）；
#   - 未来若仅需升级 ffmpeg（不改主程序），才走 release-deps.yml 发 deps-v* tag；
#     该通道仅作备用，不参与 2.0.4 首发。
# =============================================================================
jobs:
  # ---- 先建草稿 Release，三个平台 job 独立上传 artifact 到同一 tag ----
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      - name: Create draft Release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          release_name: 'TPlayer Next ${{ github.ref_name }}'
          draft: true
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- Windows：NSIS 安装包 + 自动升级（latest.json）----
  release-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true  # bin/*.exe（ffmpeg/ffprobe/sacd_extract）为 LFS 对象

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ---- 构建解码组件依赖包（先于应用构建，使二进制嵌入正确的 sha256/size）----
      # 依赖包作为主 Release 附件随 2.0.4 一同发布，不单独发 deps-v tag。
      # 产物：src-tauri/target/deps/tplayer-deps-windows-x86_64-<packVersion>.zip
      #   脚本末尾会把该 zip 的 sha256/size 写回 deps-manifest.json，
      #   紧接着的 tauri-action 即把此清单编译进应用，保证「下载后整体校验」一致。
      - name: Build deps pack (bundled with this release)
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/build-deps-pack.ps1

      - name: Build and publish Tauri app (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'TPlayer Next ${{ github.ref_name }}'
          releaseBody: |
            ## TPlayer Next ${{ github.ref_name }}

            ### 安装
            - Windows：下载 `TPlayer.Next_*_x64-setup.exe` 双击安装（自动升级用户无需手动操作）。
            - macOS：下载 `*.dmg`，打开后将 TPlayer 拖入「应用程序」（首次右键→打开）。
            - Linux (Debian/Ubuntu)：`sudo apt install ./tplayer_*_amd64.deb`。
          releaseDraft: true
          prerelease: false

      # ---- 把依赖包作为同一 Release 的附件上传（与 Windows 安装包一同发布）----
      # draft: true 保持草稿态，待 macOS / Linux job 完成后由它们翻转发布，
      # 避免提前发布导致其它平台资产尚未上传。
      - name: Upload deps pack to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: src-tauri/target/deps/tplayer-deps-windows-x86_64-*.zip

  # ---- macOS：.app + .dmg（独立运行，不依赖 Windows）----
  release-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true  # bin/*.exe（ffmpeg/ffprobe/sacd_extract）为 LFS 对象

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Tauri app (macOS .app + .dmg)
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 可选：Apple 开发者证书签名/公证。配置后产出已签名/已公证包；未配置则未签名。
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

  # ---- Linux：原生 DEB（scripts/build-deb.sh，独立运行，不依赖 Windows）----
  release-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true  # bin/*.exe（ffmpeg/ffprobe/sacd_extract）为 LFS 对象

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies (Tauri/WebKit)
        run: |
          sudo apt-get update
          # libasound2-dev：rodio/cpal 的 ALSA 后端需要 alsa-sys crate，
          # 缺失会导致 Linux 构建在编译期失败（此前 release-linux job 一直红）
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf file

      - name: Build DEB (native dpkg)
        run: bash scripts/build-deb.sh
        # bin/linux 不在仓库 → 脚本自动 BUNDLE_FFMPEG=0（安装后依赖系统 ffmpeg）。
        # 如需随包分发 ffmpeg，先在本步骤准备好 bin/linux/ffmpeg 与 bin/linux/ffprobe。

      - name: Upload Linux DEB to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/linux/*.deb

name: Dependency Compliance Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 9 * * 1" # 每周一 09:00 定期扫描
  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check
          arguments: --all-features

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install Node dependencies
        run: npm ci

      - name: Run license-checker (Node.js)
        run: |
          npx license-checker --production --csv > third_party/node_licenses.csv || true
          cat third_party/node_licenses.csv

      - name: Verify DEPENDENCIES.yml consistency
        run: |
          python3 scripts/verify_dependencies.py || true

      - name: Fail on unknown or rejected licenses
        run: |
          echo "Checking for unknown/rejected licenses..."
          if grep -r "LicenseRef-unknown" DEPENDENCIES.yml; then
            echo "::error::Found unknown license in DEPENDENCIES.yml"
            exit 1
          fi
          if grep -r "review_status: rejected" DEPENDENCIES.yml; then
            echo "::error::Found rejected dependency in DEPENDENCIES.yml"
            exit 1
          fi
          echo "License check passed."

      - name: Upload license reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-license-reports
          path: |
            third_party/node_licenses.csv
            DEPENDENCIES.yml

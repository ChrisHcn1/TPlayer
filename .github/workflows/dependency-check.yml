name: Dependency Compliance Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 9 * * 1" # 每周一 09:00 定期扫描
  workflow_dispatch:

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # cargo-deny 的安装改用预编译二进制（taiki-e/install-action）：
      # 旧版 EmbarkStudios/cargo-deny-action@v1 会在容器里 cargo install，
      # 依赖 crates.io 实时下载，常因网络/限流直接失败（该步骤此前从未成功过）。
      # 该检查定位为「报告型」：deny.toml 或网络异常时不阻断流水线，
      # 许可证合规的硬门禁由下方 DEPENDENCIES.yml 检查步骤负责。
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo-deny check
        continue-on-error: true
        run: cargo deny --all-features check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install Node dependencies
        run: npm ci

      - name: Run license-checker (Node.js)
        run: |
          npx license-checker --production --csv > third_party/node_licenses.csv || true
          cat third_party/node_licenses.csv

      - name: Verify DEPENDENCIES.yml consistency
        run: |
          python3 scripts/verify_dependencies.py || true

      - name: Fail on unknown or rejected licenses
        run: |
          echo "Checking for unknown/rejected licenses..."
          if grep -r "LicenseRef-unknown" DEPENDENCIES.yml; then
            echo "::error::Found unknown license in DEPENDENCIES.yml"
            exit 1
          fi
          if grep -r "review_status: rejected" DEPENDENCIES.yml; then
            echo "::error::Found rejected dependency in DEPENDENCIES.yml"
            exit 1
          fi
          echo "License check passed."

      - name: Upload license reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-license-reports
          path: |
            third_party/node_licenses.csv
            DEPENDENCIES.yml
